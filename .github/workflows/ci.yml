# CYVRIX CI Pipeline
# Runs unit tests, integration tests, and E2E tests

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Lint & Type Check ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Python dependencies
        run: pip install -r apps/api/requirements.txt -r tests/requirements.txt
      - name: Install Node.js dependencies
        run: cd apps/web && npm ci
      - name: TypeScript check
        run: cd apps/web && npx tsc --noEmit
      - name: Python lint
        run: python -m py_compile apps/api/app/*.py apps/api/app/**/*.py

  # ── Backend Tests ──────────────────────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt -r tests/requirements.txt
      - name: Run backend tests
        run: |
          cd tests
          rm -f *.db
          python -m pytest test_scanner.py test_risk_engine.py test_investigation.py \
            test_api.py test_github_integration.py test_scanner_security.py \
            test_migrations.py test_integration.py test_redis_integration.py \
            -v --tb=short

  # ── Frontend Tests ─────────────────────────────────────────────────
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: cd apps/web && npm ci
      - name: Run Jest tests
        run: cd apps/web && npx jest
      - name: Production build
        run: cd apps/web && npx next build

  # ── Migration Validation ──────────────────────────────────────────
  migration-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyvrix_test
          POSTGRES_PASSWORD: cyvrix_test_password
          POSTGRES_DB: cyvrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt
      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://cyvrix_test:cyvrix_test_password@localhost:5432/cyvrix_test
        run: |
          cd apps/api
          python -m alembic upgrade head
          python -m alembic current

  # ── Integration Tests ─────────────────────────────────────────────
  integration-tests:
    runs-on: ubuntu-latest
    needs: [migration-validation]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyvrix_test
          POSTGRES_PASSWORD: cyvrix_test_password
          POSTGRES_DB: cyvrix_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt -r tests/requirements.txt
      - name: Run real integration tests
        env:
          RUN_INTEGRATION_TESTS: "1"
          DATABASE_URL: postgresql+asyncpg://cyvrix_test:cyvrix_test_password@localhost:5433/cyvrix_test
          REDIS_URL: redis://localhost:6380/0
          SECRET_KEY: test-secret-key-for-ci-only
          ENVIRONMENT: test
        run: |
          cd tests
          python -m pytest test_real_integration.py -v --tb=short

  # ── Real-Stack E2E ───────────────────────────────────────────────
  real-stack-e2e:
    runs-on: ubuntu-latest
    needs: [integration-tests, frontend-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyvrix_test
          POSTGRES_PASSWORD: cyvrix_test_password
          POSTGRES_DB: cyvrix_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Playwright browsers
        run: cd apps/web && npx playwright install chromium --with-deps
      - name: Install Python dependencies
        run: pip install -r apps/api/requirements.txt -r tests/requirements.txt
      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://cyvrix_test:cyvrix_test_password@localhost:5433/cyvrix_test
        run: |
          cd apps/api
          python -m alembic upgrade head
      - name: Start FastAPI server
        env:
          DATABASE_URL: postgresql+asyncpg://cyvrix_test:cyvrix_test_password@localhost:5433/cyvrix_test
          DATABASE_URL_SYNC: postgresql://cyvrix_test:cyvrix_test_password@localhost:5433/cyvrix_test
          REDIS_URL: redis://localhost:6380/0
          SECRET_KEY: test-secret-key-for-integration-only-not-for-production-32chars!
          ENVIRONMENT: test
          APP_URL: http://localhost:3001
          API_URL: http://localhost:8001
          GITHUB_CLIENT_ID: test
          GITHUB_CLIENT_SECRET: test
          OPENAI_API_KEY: test
        run: |
          cd apps/api
          uvicorn app.main:app --host 0.0.0.0 --port 8001 &
          sleep 5
          curl -sf http://localhost:8001/api/health || exit 1
      - name: Start RQ Worker
        env:
          DATABASE_URL: postgresql+asyncpg://cyvrix_test:cyvrix_test_password@localhost:5433/cyvrix_test
          DATABASE_URL_SYNC: postgresql://cyvrix_test:cyvrix_test_password@localhost:5433/cyvrix_test
          REDIS_URL: redis://localhost:6380/0
          SECRET_KEY: test-secret-key-for-integration-only-not-for-production-32chars!
          ENVIRONMENT: test
          GITHUB_APP_ID: ""
          GITHUB_APP_PRIVATE_KEY: ""
          OPENAI_API_KEY: test
          OPENAI_MODEL: gpt-4o-mini
        run: |
          cd services/worker
          python main.py &
          sleep 3
      - name: Build and start Next.js
        run: |
          cd apps/web
          npm ci
          API_BACKEND_URL=http://localhost:8001 npx next build
          API_BACKEND_URL=http://localhost:8001 npx next start -p 3001 &
          sleep 5
          curl -sf http://localhost:3001/api/health || exit 1
      - name: Setup E2E test data
        env:
          E2E_PG_URL: postgresql://cyvrix_test:cyvrix_test_password@localhost:5433/cyvrix_test
          E2E_REDIS_URL: redis://localhost:6380/0
          SECRET_KEY: test-secret-key-for-integration-only-not-for-production-32chars!
          REDIS_URL: redis://localhost:6380/0
        run: cd apps/web && python ../../tests/setup_e2e.py
      - name: Run real-stack Playwright E2E
        env:
          E2E_API_URL: http://localhost:8001
          E2E_BASE_URL: http://localhost:3001
          DATABASE_URL: postgresql+asyncpg://cyvrix_test:cyvrix_test_password@localhost:5433/cyvrix_test
          REDIS_URL: redis://localhost:6380/0
          SECRET_KEY: test-secret-key-for-integration-only-not-for-production-32chars!
        run: |
          cd apps/web
          npx playwright test e2e/real-stack.spec.ts --reporter=list
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ── Security Checks ───────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt
      - name: Check for secrets in code
        run: |
          grep -rn "password\s*=\s*['\"]" apps/api/ --include="*.py" || true
          grep -rn "SECRET_KEY\s*=\s*['\"]" apps/api/ --include="*.py" || true
      - name: Check migration safety
        run: |
          grep -rn "subprocess\|os.system\|shell=True" apps/api/alembic/ --include="*.py" || true
