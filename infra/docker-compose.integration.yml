# CYVRIX Real-Stack Integration Test Environment
# All internal CYVRIX services are REAL.
# Only external providers (GitHub, OSV, LLM) are mocked at provider boundaries.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cyvrix_test
      POSTGRES_PASSWORD: cyvrix_test_password
      POSTGRES_DB: cyvrix_test
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyvrix_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://cyvrix_test:cyvrix_test_password@postgres:5432/cyvrix_test
      DATABASE_URL_SYNC: postgresql://cyvrix_test:cyvrix_test_password@postgres:5432/cyvrix_test
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: test-secret-key-for-integration-only-not-for-production-32chars!
      ENVIRONMENT: test
      APP_URL: http://localhost:3001
      API_URL: http://localhost:8001
      GITHUB_CLIENT_ID: test-github-client-id
      GITHUB_CLIENT_SECRET: test-github-client-secret
      GITHUB_APP_ID: ""
      GITHUB_APP_PRIVATE_KEY: ""
      GITHUB_WEBHOOK_SECRET: ""
      OPENAI_API_KEY: test-openai-key
      OPENAI_MODEL: gpt-4o-mini
      SESSION_TTL_SECONDS: 3600
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://cyvrix_test:cyvrix_test_password@postgres:5432/cyvrix_test
      DATABASE_URL_SYNC: postgresql://cyvrix_test:cyvrix_test_password@postgres:5432/cyvrix_test
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: test-secret-key-for-integration-only-not-for-production-32chars!
      ENVIRONMENT: test
      GITHUB_APP_ID: ""
      GITHUB_APP_PRIVATE_KEY: ""
      OPENAI_API_KEY: test-openai-key
      OPENAI_MODEL: gpt-4o-mini
      SCAN_TIMEOUT_MINUTES: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      API_BACKEND_URL: http://api:8000
    depends_on:
      - api

volumes:
  pgdata_test:
